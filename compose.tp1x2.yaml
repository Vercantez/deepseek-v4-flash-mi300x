# Two independent TP1 replicas on a two-MI300X host. Each replica inherits the
# validated single-GPU profile and shares the persistent filesystem KV tier.
services:
  inference-0:
    extends:
      file: compose.yaml
      service: inference
    container_name: deepseek-v4-flash-0731-mi300x-0
    environment:
      ROCR_VISIBLE_DEVICES: "0"
    ports:
      - 127.0.0.1:8000:8000

  inference-1:
    extends:
      file: compose.yaml
      service: inference
    container_name: deepseek-v4-flash-0731-mi300x-1
    environment:
      ROCR_VISIBLE_DEVICES: "1"
    ports:
      - 127.0.0.1:8002:8000
